name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/logo.svg'
      - 'docs/.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy product landing page to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-pages
          mkdir -p /tmp/gh-pages
          # Only the public landing assets — not the full product markdown tree.
          cp docs/index.html docs/logo.svg /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git init
          # Identity must be set in THIS repo after git init (local config does not carry over).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "deploy: sync landing from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          # Pushing to gh-pages already triggers the legacy Pages publisher.
          # Do not also POST /pages/builds — that races and leaves status=errored.
